<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays and Strings Problem Set</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Arrays & Strings Lab</h1>

        <section class="problem">
            <h2>1. Reverse a String</h2>
            <input id="reverseInput" placeholder="Enter a word">
            <button onclick="reverseText()">Reverse</button>
            <p id="reverseResult"></p>
        </section>

        <section class="problem">
            <h2>2. Find Largest Number</h2>
            <input id="numbersInput" placeholder="Example: 10, 25, 5, 40">
            <button onclick="findLargest()">Find Largest</button>
            <p id="largestResult"></p>
        </section>

        <section class="problem">
            <h2>3. Count Vowels</h2>
            <input id="vowelInput" placeholder="Enter a sentence">
            <button onclick="countVowels()">Count Vowels</button>
            <p id="vowelResult"></p>
        </section>

        <section class="problem">
            <h2>4. Remove Duplicate Numbers</h2>
            <input id="duplicateInput" placeholder="Example: 1, 2, 2, 3, 4, 4">
            <button onclick="removeDuplicates()">Remove Duplicates</button>
            <p id="duplicateResult"></p>
        </section>

        <section class="problem">
            <h2>5. Check Palindrome</h2>
            <input id="palindromeInput" placeholder="Enter a word">
            <button onclick="checkPalindrome()">Check</button>
            <p id="palindromeResult"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
