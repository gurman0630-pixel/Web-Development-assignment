<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Summary Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Profile Summary Generator</h1>

        <div class="form">
            <input id="name" placeholder="Full name">
            <input id="course" placeholder="Course">
            <input id="university" placeholder="University">
            <input id="skills" placeholder="Skills separated by commas">
            <input id="email" type="email" placeholder="Email">

            <button onclick="generateProfile()">Generate Profile</button>
        </div>

        <div id="profile"></div>

        <h2>Object Information</h2>
        <pre id="objectInfo"></pre>
    </main>

    <script src="script.js"></script>
</body>
</html>
