<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing Layout</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    
    <header class="page-header">
        <h1>My store</h1>
        <p>Explore our feature Products</p>
    </header>

    <main class="product-container">

        <div class="product-card">
            <div class="product-image">Headphones</div>
            <h2>Wireless Headphones</h2>
            <p>Enjoy your favourite music everywhere.</p>
            <p class="price">₹1,499</p>
            <button>Add to cart</button>
        </div>

         <div class="product-card">
        <div class="product-image">Smart Watch</div>
        <h2>Smart Watch</h2>
        <p>Track your daily activity with ease.</p>
        <p class="price">₹2,499</p>
        <button>Add to Cart</button>
    </div>

    <div class="product-card">
        <div class="product-image">Speaker</div>
        <h2>Bluetooth Speaker</h2>
        <p>Enjoy clear sound wherever you go.</p>
        <p class="price">₹999</p>
        <button>Add to Cart</button>
    </div>

    </main>
</body>
</html>
