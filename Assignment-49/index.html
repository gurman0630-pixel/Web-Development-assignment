<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persistent To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>My Persistent To-Do List</h1>
        <p>Your tasks will remain saved after refreshing.</p>

        <form id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
                required
            >
            <button type="submit" id="submitButton">Add Task</button>
        </form>

        <div class="filters">
            <button type="button" data-filter="all">All</button>
            <button type="button" data-filter="pending">Pending</button>
            <button type="button" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList"></ul>

        <p id="taskCount"></p>
        <p id="message" aria-live="polite"></p>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
