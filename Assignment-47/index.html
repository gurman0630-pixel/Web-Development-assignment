<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Helper Module</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Storage Helper</h1>

        <input type="text" id="key" placeholder="Enter storage key">
        <input type="text" id="value" placeholder="Enter storage value">

        <button id="saveButton">Save Data</button>
        <button id="getButton">Get Data</button>
        <button id="deleteButton">Delete Data</button>
        <button id="clearButton">Clear Storage</button>

        <p id="output" aria-live="polite"></p>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
