<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Utilities</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="container">
        <h1>Math Utility Calculator</h1>

        <input type="number" id="num1" placeholder="First number">
        <input type="number" id="num2" placeholder="Second number">

        <button onclick="calculate('add')">Addition</button>
        <button onclick="calculate('subtract')">Subtraction</button>
        <button onclick="calculate('multiply')">Multiplication</button>
        <button onclick="calculate('divide')">Division</button>
        <button onclick="calculate('power')">Power</button>

        <h2 id="result">Result will appear here</h2>
    </div>

    <script src="mathUtils.js"></script>
    <script src="Script.js"></script>
</body>
</html>
