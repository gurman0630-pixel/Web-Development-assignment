<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard layout</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="dashboard">
         <aside class="sidebar">
            <h2>My Dashboard</h2>
            <nav>
                <a href="#">Overview</a>
                <a href="#">Analytics</a>
                <a href="#">Projects</a>
                <a href="#">Settings</a>
            </nav>
         </aside>

         <main class="main-content">
            <header class="dashboard-header">
            <h1>Overview</h1>
            <p>Welcome back! Here is your summary.</p>
        </header>

        <section class="stats-container">

            <div class="stat-card">
                <h3>Total Users</h3>
                <p>1,250</p>
            </div>

            <div class="stat-card">
                <h3>Total Sales</h3>
                <p>₹25,000</p>
            </div>

            <div class="stat-card">
                <h3>Projects</h3>
                <p>18</p>
            </div>

        </section>

         </main>
    </div>

    
</body>
</html>
