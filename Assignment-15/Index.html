
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="Style.css">
    <script src="Script.js" defer></script>
</head>
<body>
    <main class="profile-card">
        <div class="avatar" id="avatar">GS</div>

        <h1 id="student-name">Student Name</h1>
        <p class="course" id="student-course">Course</p>

        <div class="details">
            <p><strong>Age:</strong> <span id="age"></span></p>
            <p><strong>University:</strong> <span id="university"></span></p>
            <p><strong>Skills:</strong> <span id="skills"></span></p>
            <p><strong>Attendance:</strong> <span id="attendance"></span></p>
            <p><strong>Currently Learning:</strong> <span id="learning"></span></p>
            <p><strong>Profile Active:</strong> <span id="active"></span></p>
        </div>

        <p class="footer-text">My journey, my progress.</p>
    </main>
</body>
</html>
